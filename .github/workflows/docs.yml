name: Docs

# Sphinx -> GitHub Pages. Enable: Settings > Pages > Source = "GitHub Actions".
# Also runs after each release so the version shown comes from the new tag.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # conf.py reads the version from git tags
      - uses: ./.github/actions/setup
        with: { groups: docs }
      - run: poetry run sphinx-build -W -b html docs public
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
