name: CI

on:
  push:
    branches:
      [main, "dev/**", "feature/**", "bugfix/**", "hotfix/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: poetry run ruff check .
      - run: poetry run mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: >
          poetry run pytest tests
          --cov=src --cov-report term-missing --cov-report xml:coverage.xml
          --junitxml=test-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-report.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: poetry build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with:
          groups: docs
      - run: poetry run sphinx-build -W -b html docs public
