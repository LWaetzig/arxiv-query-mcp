name: Test release (TestPyPI)

# Publishes 0.0.0.dev<run_number> from work branches.
# Requires a TestPyPI trusted publisher: workflow test-release.yml, environment testpypi.
on:
  push:
    branches: ["feature/**", "bugfix/**", "hotfix/**", "release/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: sed -i -e "0,/0.0.0/s//0.0.0.dev${{ github.run_number }}/" pyproject.toml
      - run: poetry build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
